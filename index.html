<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trading Terminal - Architecture & Platform</title>
    <meta name="description" content="High-performance, ultra-fast Trading Terminal platform foundation and architecture." />
    <meta property="og:title" content="Trading Terminal - Architecture & Platform" />
    <meta property="og:description" content="High-performance, ultra-fast Trading Terminal platform foundation and architecture." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const saved = localStorage.getItem('trading_terminal_theme');
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #root:empty {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        background-color: #f8fafc;
      }
      .dark #root:empty {
        background-color: #09090b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
